# Каталог облигационных выпусков.
#
# Параметры (номинал, ставка, частота, даты) берутся из проспекта эмиссии или
# из карточки выпуска в приложении брокера. Биржа не отдаёт их машиночитаемо,
# поэтому они живут здесь — и расчёты работают, даже когда сайт недоступен.
#
# Частота задаётся ОДНИМ из двух полей, ровно как написано на карточке:
#   per_year: 12      — когда указано «Месячный»
#   period_days: 30   — когда указано «30 дней»
# Это не одно и то же: 365/30 = 12,17 периода в году, и доходность отличается.
#
# ВНИМАНИЕ: даты выпуска и погашения ниже — ЗАГЛУШКИ. На скриншотах виден
# только срок («3 год»), но не дата начала. Проставьте реальные даты из
# проспекта, иначе календарь купонов будет смещён.

