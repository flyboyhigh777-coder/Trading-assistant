# Необязательный YAML с настройками. Путь: --config или UZINVEST_CONFIG.
# Переменные окружения перекрывают всё, что здесь написано.

catalog_path: bonds.yaml
subscribers_path: data/subscribers.json

# Сайт биржи. Официального API нет, поэтому это HTML-страницы;
# парсер калибруется командой `python -m uzinvest fetch --tables`.
stocks_url: https://www.uzse.uz/isu_infos/STK
bonds_url: https://www.uzse.uz/isu_infos/BND
quotes_cache_seconds: 900
stale_after_days: 5        # сколько дней без сделок считать «бумага стоит»

# Ориентиры, с которыми бот сравнивает доходность выпуска.
default_deposit_rate: 0.22
default_inflation: 0.10

# Напоминания о купонах.
reminder_hour_utc: 4       # 09:00 по Ташкенту
coupon_reminder_days: 3
alert_cooldown_seconds: 72000

rate_limit_per_minute: 20  # на пользователя, не на IP
free_trial_days: 7

webhook_host: 0.0.0.0
webhook_port: 8080
webhook_path: /api/billing
