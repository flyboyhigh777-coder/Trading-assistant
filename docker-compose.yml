services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Здесь живут подписчики, заказы и каталог выпусков. Терять нельзя:
      # вместе с файлом теряется и то, кто оплатил.
      - ./data:/app/data
    ports:
      # Сюда направляется туннель (локально) или обратный прокси (в проде):
      # на этом порту и эндпоинты Payme/Click, и /health.
      - "8080:8080"
