[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pockettrader"
version = "0.1.0"
description = "Signal engine and Telegram assistant for short-expiry trades"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "ccxt>=4.3.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "python-telegram-bot[job-queue]>=21.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
pockettrader = "pockettrader.cli:main"

[tool.setuptools.packages.find]
include = ["pockettrader*"]
