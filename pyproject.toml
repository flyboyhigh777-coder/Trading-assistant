[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uzinvest"
version = "0.2.0"
description = "Помощник по облигациям и акциям узбекского рынка с оплатой через Payme и Click"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-telegram-bot[job-queue]>=21.0",
    "aiohttp>=3.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
uzinvest = "uzinvest.cli:main"

[tool.setuptools.packages.find]
include = ["uzinvest*"]
